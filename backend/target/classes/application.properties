# ============================================
# SIWMS - Smart Inventory & Warehouse Management System
# Spring Boot Application Configuration
# ============================================

# Application
spring.application.name=SIWMS
server.port=8080
server.servlet.context-path=/api

# ============================================
# Database Configuration (H2 In-Memory)
# ============================================
spring.datasource.url=jdbc:h2:mem:siwms_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ============================================
# JWT Security Configuration
# ============================================
app.jwt.secret=SiwmsEnterprise2024SecretKey@#$SpringBootJWTSecurityTokenForWarehouseManagement
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ============================================
# Email Configuration (SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@siwms.com
spring.mail.password=your_email_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================
# File Upload
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ============================================
# Actuator
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# ============================================
# Logging
# ============================================
logging.level.com.siwms=DEBUG
logging.level.org.springframework.security=INFO
logging.file.name=logs/siwms.log

# ============================================
# CORS
# ============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8443
